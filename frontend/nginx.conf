server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # ---- Cabeceras de seguridad del frontend ----
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.googleusercontent.com https://*.gstatic.com https://content.r9cdn.net; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # ---- Único backend del navegador: el API Gateway GraphQL ----
    # Mismo origen => la cookie de sesión (SameSite=Strict, httpOnly) viaja
    # sin CORS y el navegador nunca conoce la red interna de microservicios.
    location /graphql {
        proxy_pass http://gateway:4000/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100k;
    }

    # Sin add_header aquí: en Nginx un add_header dentro de location anula los
    # del server y se perderían las cabeceras de seguridad.
    location /assets/ {
        expires 7d;
    }

    location / {
        try_files $uri /index.html;
    }
}
